# ==========================================
# CivicFix Application Configuration
# ==========================================
spring.application.name=civicfix
server.port=8080

# Active Profile: 'dev' (H2 embedded - instant zero-setup) or 'mysql' (MySQL 8 database)
spring.profiles.active=dev

# File Upload Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=20MB
app.upload.dir=./uploads

# Security & JWT Configuration
app.jwt.secret=CivicFixSuperSecretSecureKeyForJwtTokenGenerationAndValidation2026!
app.jwt.expiration-ms=86400000

# JSON Formatting
spring.jackson.date-format=yyyy-MM-dd HH:mm:ss
spring.jackson.time-zone=UTC
spring.jackson.serialization.fail-on-empty-beans=false

# ==========================================
# Default Dev Profile (H2 In-Memory/File DB)
# ==========================================
spring.datasource.url=jdbc:h2:file:./data/civicfixdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# H2 Console (Accessible at /h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false
